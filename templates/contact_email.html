<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
</head>
<body style="margin:0;padding:30px;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0">
<tr><td align="center">
<table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,.05);">
<tr><td style="background:#0f172a;padding:40px;text-align:center;color:white;">
<h1 style="margin:0;font-size:28px;font-weight:700;">📩 New Contact Message</h1>
</td></tr>
<tr><td style="padding:40px;color:#334155;font-size:16px;line-height:1.6;">
<p style="margin-top:0;">Hello Admin,</p>
<p>A new message has been submitted through the Smart Waste AI contact form.</p>
<table width="100%" cellpadding="15" cellspacing="0" style="border:1px solid #e2e8f0;border-radius:8px;margin:25px 0;">
<tr style="background:#f8fafc;">
<td width="120" style="font-weight:bold;color:#475569;border-bottom:1px solid #e2e8f0;">Name</td>
<td style="border-bottom:1px solid #e2e8f0;">{{ name }}</td>
</tr>
<tr>
<td style="font-weight:bold;color:#475569;border-bottom:1px solid #e2e8f0;">Email</td>
<td style="border-bottom:1px solid #e2e8f0;">{{ email }}</td>
</tr>
<tr style="background:#f8fafc;">
<td style="font-weight:bold;color:#475569;border-bottom:1px solid #e2e8f0;">Phone</td>
<td style="border-bottom:1px solid #e2e8f0;">{{ phone }}</td>
</tr>
<tr>
<td style="font-weight:bold;color:#475569;border-bottom:1px solid #e2e8f0;">Subject</td>
<td style="border-bottom:1px solid #e2e8f0;">{{ subject_text }}</td>
</tr>
<tr style="background:#f8fafc;">
<td style="font-weight:bold;color:#475569;vertical-align:top;">Message</td>
<td style="white-space:pre-wrap;">{{ message }}</td>
</tr>
</table>
</td></tr>
<tr><td style="background:#f1f5f9;padding:24px;text-align:center;font-size:14px;color:#64748b;">
<strong>Smart Waste AI Admin System</strong>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
